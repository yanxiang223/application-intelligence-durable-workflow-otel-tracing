"""
durable_workflow.yaml
====================
FunctionGraph workflow definition for the document-review workflow.

This implements a durable workflow using FunctionGraph's native workflow capabilities.
The workflow orchestrates four step functions using FunctionGraph's native YAML DSL.

Key design points:
  - Uses a YAML state machine definition for orchestration
  - 'Wait' state type handles callback-based suspension
  - Each step is a separate FunctionGraph function invocation
  - Workflow execution ID serves as the unified trace ID
  - No replay semantics — completed steps are never re-executed in a new invocation

Workflow steps:
  1. extract_text  -> Extract text from document
  2. summarize     -> Summarize extracted text
  3. human_review  -> Wait for human approval callback
  4. publish       -> Publish if approved

Usage:
  Deploy via Terraform (huaweicloud_fgs_workflow resource).
  The workflow definition is embedded in the Terraform resource.

References:
  FunctionGraph workflow DSL:
    https://console-intl.myhuaweicloud.com/apig/
"""

