"""
Implementation Notes
====================

This workflow is implemented entirely on FunctionGraph using its native
workflow DSL (YAML state machine). Key design points:

1. Replay semantics:
   - Each step is a separate FunctionGraph function invocation. The workflow
     engine manages state and never re-invokes a completed step.

2. Callback mechanism:
   - The 'Wait' state with callback_type suspends the execution; the external
     reviewer POSTs to the workflow callback URI provided by the engine.

3. Trace ID derivation:
   - The workflow_execution_id is used as the unified trace ID and propagated
     through the event chain; trace context uses the W3C 'traceparent' header.

4. SDK vs YAML:
   - Orchestration is expressed as a YAML state machine; step functions are
     plain Python. No third-party orchestration SDK is required.

Tracing:
-------
  Traces are exported via the OpenTelemetry OTLP exporter to Huawei Cloud
  Distributed Tracing (OTLP-compatible):

    https://tracing.{region}.myhuaweicloud.com

  Trace context is propagated via the W3C 'traceparent' header in HTTP calls.
  Each step function initializes its own TracerProvider and creates spans.
  The workflow_execution_id is passed through the event chain to correlate
  all spans.
"""
